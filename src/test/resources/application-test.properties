spring.application.name=TestCloudStorage
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=testPostgres
spring.datasource.password=testPostgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

#spring.data.redis.host=localhost
#spring.data.redis.port=6379

spring.session.store-type=redis
spring.session.redis.namespace=cloudstorage:sessions
spring.session.timeout=6h

server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

minio.endpoint=http://localhost:9000/
minio.access-key=testMinio
minio.secret-key=testMinio
minio.root-bucket=user-files

redis.data.key-prefix=cloudstorage:sessions:sessions: